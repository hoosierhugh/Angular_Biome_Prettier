<div class="mx-auto my-5 w-70 rounded-lg border-2 border-gray-300 p-5 text-center font-sans">
  <h3>Shopping Cart Item</h3>

  <!-- Display the current state -->
  <div class="my-4 text-3xl">
    Quantity: <strong>{{ quantity() }}</strong>
  </div>

  <!-- Feedback Message: Changes color and text based on state -->
  <p [class]="isFull() ? 'text-red-600 font-bold' : 'text-green-600 font-bold'">
    {{ isFull() ? 'Maximum stock reached (10)!' : 'Items available to add.' }}
  </p>

  <div class="button-group">
    <!-- Disabled when quantity is 0 -->
    <button
      class="m-1.5 cursor-pointer px-3 py-2 text-base disabled:cursor-not-allowed disabled:bg-gray-100 disabled:text-gray-400"
      (click)="decrease()"
      [disabled]="quantity() === 0"
    >
      - Remove
    </button>

    <!-- Disabled when quantity is 10 -->
    <button
      class="m-1.5 cursor-pointer px-3 py-2 text-base disabled:cursor-not-allowed disabled:bg-gray-100 disabled:text-gray-400"
      (click)="increase()"
      [disabled]="isFull()"
    >
      + Add Item
    </button>
  </div>
</div>
